<style>
:root{
  --asphalt:#0d0e10;
  --concrete:#c9cacc;
  --steel:#8b8e93;
  --panel:#16181b;
  --line:#2a2d31;
  --mblue:#1c69d4;
  --mred:#e4002b;
  --mdark:#0a3d91;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--asphalt);color:var(--concrete);font-family:var(--body);line-height:1.65;font-size:17px}
a{color:inherit}
:focus-visible{outline:2px solid var(--mblue);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}

/* Nav */
header{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(13,14,16,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.06em;text-decoration:none;color:#fff}
nav ul{display:flex;gap:22px;list-style:none;font-size:15px}
nav ul a{text-decoration:none;color:var(--steel);transition:color .2s}
nav ul a:hover{color:#fff}
.mstripe{display:flex;height:4px;width:64px}
.mstripe i{flex:1}
.mstripe i:nth-child(1){background:#4aa3ff}
.mstripe i:nth-child(2){background:var(--mdark)}
.mstripe i:nth-child(3){background:var(--mred)}
